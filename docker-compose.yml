services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-mkjs}:${POSTGRES_PASSWORD:-mkjs}@postgres:5432/${POSTGRES_DB:-mkjs}
    ports:
      - "55555:55555"
    volumes:
      - ./game:/app/game
      - ./server:/app/server
      - server_node_modules:/app/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mkjs}
      POSTGRES_USER: ${POSTGRES_USER:-mkjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkjs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mkjs} -d ${POSTGRES_DB:-mkjs}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  server_node_modules:

